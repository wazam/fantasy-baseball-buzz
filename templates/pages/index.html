{% extends 'base.html' %}
{% from 'macros/trends.html' import source_tile, trend_table %}

{% block content %}

    <nav class="source-tiles" aria-label="Sources">
        {% for source in sources %}
            {{ source_tile(source, statuses) }}
        {% endfor %}
    </nav>

    {% for source in sources %}
        {{ trend_table(source, statuses) }}
    {% endfor %}

    <script id="trend-statuses" type="application/json">{{ statuses | tojson }}</script>

{% endblock %}
