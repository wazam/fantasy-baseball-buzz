# https://github.com/actions/starter-workflows/blob/main/ci/python-app.yml

name: Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pipenv

      - name: Install Pipenv and dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --deploy --ignore-pipfile

      - name: Lint (syntax errors, undefined names, likely bugs and missing commas between strings)
        run: pipenv run flake8 . --select=E9,F63,F7,F82,F50,F52,F601,F602,F811,F901,W605,ISC001,ISC004 --count --show-source --statistics

      - name: Lint (full style report)
        run: pipenv run flake8 . --exit-zero --max-complexity=10 --extend-ignore=E501 --count --show-source --statistics
