# https://github.com/peter-evans/docker-compose-actions-workflow

name: Compose Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '22 22 * * 3'
  workflow_dispatch:
  # Test what Docker Publish just published
  workflow_run:
    workflows: [Docker Publish]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    name: Validate Stack with Docker Compose (${{ matrix.source }} on ${{ matrix.runner }})
    # After a publish, only test if the publish succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        # Source build: amd64 only. Published images: both registries, both platforms
        runner: ${{ fromJSON(github.event_name == 'workflow_run' && '["ubuntu-latest","ubuntu-24.04-arm"]' || '["ubuntu-latest"]') }}
        source: ${{ fromJSON(github.event_name == 'workflow_run' && '["ghcr.io/wazam/fantasy-baseball-buzz","wazam123/fantasy-baseball-buzz"]' || '["build"]') }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # After a publish, test with the compose.yaml from the released commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        if: matrix.source == 'build'
        uses: docker/setup-buildx-action@v4

      - name: Get the image
        env:
          SOURCE: ${{ matrix.source }}
          # The tag that triggered Docker Publish, such as v0.4.0
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$SOURCE" = build ]; then
            docker build --load -t ghcr.io/wazam/fantasy-baseball-buzz:latest .
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "expected a vX.Y.Z tag, got '$TAG'"; exit 1; }
            docker pull "$SOURCE:${TAG#v}"
            # compose.yaml runs ghcr.io/...:latest, so give the pulled image that name
            docker tag "$SOURCE:${TAG#v}" ghcr.io/wazam/fantasy-baseball-buzz:latest
          fi

      - name: Create data directory
        run: mkdir -p data && sudo chown 1000:1000 data

      - name: Start stack and wait for healthcheck
        run: docker compose -f compose.yaml up -d --wait --wait-timeout 180

      - name: Verify web UI is responding
        run: curl --retry 10 --retry-connrefused --retry-max-time 120 --fail http://localhost:9108/index

      - name: Verify players database is created and served
        run: curl --fail --silent http://localhost:9108/players | jq -e '.rows | type == "array"'

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs

      - name: Teardown
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
