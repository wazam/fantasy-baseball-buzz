# https://github.com/actions/starter-workflows/blob/main/ci/python-app.yml

name: Test & Lint Python App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pipenv

    - name: Install Pipenv & Dependencies
      run: |
        python -m pip install --upgrade pip pipenv
        pipenv install --dev --deploy --ignore-pipfile

    - name: Lint with flake8 (fail on critical errors)
      run: pipenv run flake8 . --select=E9,F63,F7,F82

    - name: Lint with flake8 (full style report)
      run: pipenv run flake8 . --exit-zero
