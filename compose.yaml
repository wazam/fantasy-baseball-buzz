# https://github.com/wazam/fantasy-baseball-buzz
services:
  buzz:
    image: ghcr.io/wazam/fantasy-baseball-buzz:latest
    container_name: buzz
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    read_only: true
    user: "1000:1000"
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m
    environment:
      - FANTRAX_LEAGUE_ID=${FANTRAX_LEAGUE_ID:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/usr/src/data
    ports:
      - "9108:9108"
