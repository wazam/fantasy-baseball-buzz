services:
  buzz:
    image: ghcr.io/wazam/fantasy-baseball-buzz:latest
    container_name: buzz
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - FANTRAX_LEAGUE_ID=${FANTRAX_LEAGUE_ID:-}  # optional
      - TZ=${TZ:-UTC}  # optional
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}  # optional
    volumes:
      - ./data:/usr/src/data
    ports:
      - "9108:9108"
